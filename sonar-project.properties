sonar.projectKey=innovation-sandbox_agent-manager_1297949a-9c08-4b7f-9e0e-8d040c6d8d94
sonar.projectName=agent-manager

# Monorepo: el código vive en backend/src y frontend/src (no en /src a nivel raíz)
sonar.sources=backend/src,frontend/src
sonar.tests=test

sonar.sourceEncoding=UTF-8

# Exclusiones globales
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/.venv/**,**/*.min.js,backend/src/infra/db/seed-*.ts,frontend/public/**

# Exclusiones específicas de cobertura
sonar.coverage.exclusions=**/*.test.ts,**/*.spec.ts,**/*.test.tsx,**/*.spec.tsx,**/tests/**,**/test/**,**/__tests__/**,**/seed-*.ts

# Patrones de archivos de prueba
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts,**/*.test.tsx,**/*.spec.tsx

# Reportes de cobertura (si se generan)
sonar.javascript.lcov.reportPaths=coverage/lcov.info,backend/coverage/lcov.info,frontend/coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info,backend/coverage/lcov.info,frontend/coverage/lcov.info
